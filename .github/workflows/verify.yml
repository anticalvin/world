name: Verify AWAKEN
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser dependencies
        run: npm ci
      - name: Install Colyseus server dependencies
        run: npm --prefix server ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck and production build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Browser tests (desktop and 390x844 mobile)
        run: npm run test:browser
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

var wasLock=false;document.addEventListener("pointerlockchange",function(){var l=!!document.pointerLockElement;if(wasLock&&!l&&playing&&!paused)pause();wasLock=l});
addEventListener("keydown",function(e){if(!playing||csw.style.display!="none")return;
 if(e.code=="Escape"||e.code=="KeyP"){paused?resume():pause();return}
 if(paused){if(e.code=="ArrowDown")pi=(pi+1)%5;else if(e.code=="ArrowUp")pi=(pi+4)%5;else if(e.code=="Enter")items[pi][1]();else return;rp();e.preventDefault();return}
 keys[e.code]=1;if(e.code=="KeyV")tv();if(e.code=="KeyF"||e.code=="Space")power();if(e.code.indexOf("Arrow")==0||e.code=="Space")e.preventDefault()});
addEventListener("keyup",function(e){keys[e.code]=0});
var cv=$("game");cv.addEventListener("click",function(){if(playing&&!paused&&cv.requestPointerLock)cv.requestPointerLock()});
addEventListener("mousemove",function(e){if(playing&&!paused&&document.pointerLockElement){yaw-=e.movementX*.0025;pitch=clamp(pitch-e.movementY*.0025,-1.2,1.2)}});
var tl=null,tr=null;
cv.addEventListener("touchstart",function(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i],o={id:t.identifier,x:t.clientX,y:t.clientY};if(t.clientX<innerWidth/2)tl=o;else tr=o}},{passive:true});
cv.addEventListener("touchmove",function(e){if(!playing||paused)return;for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
 if(tl&&t.identifier==tl.id){joy.x=clamp((t.clientX-tl.x)/50,-1,1);joy.y=clamp((t.clientY-tl.y)/50,-1,1)}
 if(tr&&t.identifier==tr.id){yaw-=(t.clientX-tr.x)*.006;pitch=clamp(pitch-(t.clientY-tr.y)*.006,-1.2,1.2);tr.x=t.clientX;tr.y=t.clientY}}},{passive:true});
function te(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(tl&&t.identifier==tl.id){tl=null;joy.x=joy.y=0}if(tr&&t.identifier==tr.id)tr=null}}
cv.addEventListener("touchend",te);cv.addEventListener("touchcancel",te);
$("bp").onclick=pause;$("bv").onclick=tv;$("bw").onpointerdown=function(e){e.preventDefault();power()};
requestAnimationFrame(frame);
})();
</script></body></html>
